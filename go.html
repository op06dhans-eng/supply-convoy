<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111416">
<title>課堂遊戲</title>
<style>
:root { --bg: #111416; --card: #1b2023; --line: #3a4246; --fg: #f2f4f3; --muted: #aab5b0; --ok: #3fd17a; --hot: #ffb15a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; font-weight: 700; }
main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }
h1 { margin: 0; font-size: clamp(30px, 8vw, 46px); font-weight: 900; }
#msg { font-size: clamp(20px, 5.4vw, 28px); line-height: 1.5; }
#sub { font-size: 17px; color: var(--muted); line-height: 1.6; max-width: 520px; }
.dots::after { content: ''; animation: d 1.5s steps(4) infinite; }
@keyframes d { 0% { content: ''; } 25% { content: '．'; } 50% { content: '．．'; } 75% { content: '．．．'; } }
.pick { display: flex; flex-direction: column; gap: 12px; width: min(420px, 100%); margin-top: 8px; }
.pick a { display: block; padding: 16px; border-radius: 14px; border: 3px solid var(--line); background: var(--card); color: var(--fg); text-decoration: none; font-size: 22px; font-weight: 900; }
.pick a small { display: block; font-size: 15px; color: var(--muted); margin-top: 4px; }
.pick a.on { border-color: var(--hot); }
</style>
</head>
<body>
<main>
  <h1>課堂遊戲</h1>
  <div id="msg" class="dots">連線中</div>
  <div id="sub">老師打開今天的遊戲後，這個畫面會自動帶你進去，不用再掃一次。</div>
  <div class="pick" id="pick" hidden>
    <a id="gConvoy" href="#">補給公路<small>兩人一台車，把補給送到前線</small></a>
    <a id="gRadar" href="#">雷達站攻防<small>自己飛無人機，攻擊老師的雷達站</small></a>
  </div>
</main>
<script type="module">
const CFG = { apiKey: 'AIzaSyCtxZmkrZ8tcCONC5DQbEU5ySlos9i-a8o', authDomain: 'drone-swarm-class.firebaseapp.com', databaseURL: 'https://drone-swarm-class-default-rtdb.asia-southeast1.firebasedatabase.app', projectId: 'drone-swarm-class', storageBucket: 'drone-swarm-class.firebasestorage.app', messagingSenderId: '528664638395', appId: '1:528664638395:web:e478a9b393bbfe4b85ca9e' };
// 兩款遊戲的學生網址（同一個網站底下的兩個資料夾）
const BASE = location.protocol === 'file:' ? 'https://op06dhans-eng.github.io/' : location.origin + location.pathname.replace(/[^/]*\/[^/]*$/, '');
const GAMES = { convoy: { name: '補給公路', url: BASE + 'supply-convoy/play.html' }, radar: { name: '雷達站攻防', url: BASE + 'radar-defense/play.html' } };
const $ = (id) => document.getElementById(id);
$('gConvoy').href = GAMES.convoy.url; $('gRadar').href = GAMES.radar.url;
const FRESH = 12 * 3600 * 1000; // 12 小時內老師打開過的才算「今天的遊戲」
const L = { convoy: null, radar: null }; let offset = 0, going = false, got = 0;
function decide() {
  if (going) return;
  const now = Date.now() + offset;
  const c = [['convoy', L.convoy], ['radar', L.radar]].filter(([, v]) => v && v.at && now - v.at < FRESH).sort((a, b) => b[1].at - a[1].at);
  if (!c.length) { if (got >= 2) { $('msg').className = 'dots'; $('msg').textContent = '等老師打開今天的遊戲'; $('pick').hidden = false; } return; }
  const g = GAMES[c[0][0]]; going = true;
  $('msg').className = ''; $('msg').textContent = `今天的遊戲：${g.name}，正在進入…`; $('pick').hidden = true;
  setTimeout(() => location.replace(g.url), 700);
}
setTimeout(() => { if (!going && got < 2) { $('msg').className = ''; $('msg').textContent = '連不上線，請直接選遊戲：'; $('pick').hidden = false; } }, 8000);
try {
  const A = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
  const D = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');
  const db = D.getDatabase(A.initializeApp(CFG));
  D.onValue(D.ref(db, '.info/serverTimeOffset'), (s) => { offset = s.val() || 0; });
  D.onValue(D.ref(db, 'sr/lobby'), (s) => { L.convoy = s.val(); got++; decide(); });
  D.onValue(D.ref(db, 'rd/lobby'), (s) => { L.radar = s.val(); got++; decide(); });
} catch (e) { $('msg').className = ''; $('msg').textContent = '連不上線，請直接選遊戲：'; $('pick').hidden = false; }
</script>
</body>
</html>
